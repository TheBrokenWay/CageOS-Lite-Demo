name: verify

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'  # weekly on Monday 03:00 UTC

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run quickstart
        run: ./quickstart.sh
